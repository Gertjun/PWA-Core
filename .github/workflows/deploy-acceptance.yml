name: Deploy WebAuthn acceptance fixture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-core-acceptance-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Require main branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Acceptance fixture may only be deployed from main."
            exit 1
          fi

      - name: Checkout exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checked out commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Checked out commit does not match workflow dispatch commit."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Assemble isolated static site
        run: |
          set -euo pipefail
          mkdir -p _site/acceptance/js/core
          cp tests/acceptance/index.html _site/acceptance/index.html
          cp tests/acceptance/acceptance.css _site/acceptance/acceptance.css
          cp tests/acceptance/js/config.js _site/acceptance/js/config.js
          cp tests/acceptance/js/acceptance.js _site/acceptance/js/acceptance.js
          cp js/core/biometric.js js/core/crypto.js _site/acceptance/js/core/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy acceptance fixture
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
