name: Deploy WebAuthn acceptance fixture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-core-acceptance-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Require main branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Acceptance fixture may only be deployed from main."
            exit 1
          fi

      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checked out commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Checked out commit does not match workflow dispatch commit."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Assemble isolated static site
        run: |
          set -euo pipefail
          mkdir -p _site/acceptance/js/core
          cp tests/acceptance/index.html _site/acceptance/index.html
          cp tests/acceptance/acceptance.css _site/acceptance/acceptance.css
          cp tests/acceptance/js/config.js _site/acceptance/js/config.js
          cp tests/acceptance/js/acceptance.js _site/acceptance/js/acceptance.js
          cp js/core/biometric.js js/core/crypto.js _site/acceptance/js/core/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy acceptance fixture
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
