name: Core checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Controleer JavaScript-syntaxis
        run: |
          for file in js/core/*.js; do node --experimental-default-type=module --check "$file"; done
          node --experimental-default-type=module --check tests/acceptance/js/acceptance.js
          node --experimental-default-type=module --check tests/acceptance/js/config.js
      - name: Controleer manifest en allowlist
        run: node tools/manifest.mjs verify
      - name: Voer generieke tests uit
        run: node --experimental-default-type=module --test tests/*.test.js
      - name: Voer synthetische browsertest voor koppelen uit
        run: |
          npm install --prefix "$RUNNER_TEMP/pwa-browser" --no-save --no-package-lock playwright-core@1.56.1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pwa-browser/node_modules/playwright-core/index.mjs" node tests/browser-pairing/smoke.mjs
