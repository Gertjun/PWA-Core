name: Core checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Controleer JavaScript-syntaxis
        run: for file in js/core/*.js; do node --experimental-default-type=module --check "$file"; done
      - name: Controleer manifest en allowlist
        run: node tools/manifest.mjs verify
      - name: Voer generieke tests uit
        run: node --experimental-default-type=module --test tests/*.test.js
